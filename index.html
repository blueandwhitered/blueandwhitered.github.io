<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download</title>
  <script>
    (async () => {
      const incoming = new URL(location.href);
      const root = new URL('./', incoming);
      let target = new URL('004/' + incoming.search + incoming.hash, root);
      if (!incoming.search) {
        try {
          const cache = await caches.open('personal-site-download-params-v1');
          const response = await cache.match(new URL('__saved_download_params__', root).href);
          const saved = response && await response.json();
          if (saved?.url) {
            const previous = new URL(saved.url);
            if (previous.origin === root.origin && previous.pathname.startsWith(root.pathname)) {
              let path = previous.pathname.slice(root.pathname.length);
              path = path.replace(/^v(001|002|003)(?=\/|$)/, '$1');
              if (!path || path === 'index.html' || /^v0022(?:\/|$)/.test(path)) path = '004/';
              target = new URL(path + previous.search + previous.hash, root);
            }
          }
        } catch (error) {
          console.warn('Could not restore the saved page', error);
        }
      }
      location.replace(target.href);
    })();
  </script>
</head>
<body><a href="./004/">Continue</a></body>
</html>
